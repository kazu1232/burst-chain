<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0510">
<title>PHOENIX RISE - 凰昇</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    background: #0a0510;
  }
  body {
    color: white;
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #canvas-wrap {
    position: relative; width: 100%; height: 100%;
    max-width: 540px;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block; touch-action: none;
    width: 100%; height: 100%;
  }
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 0);
    left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 10px 14px;
    pointer-events: none; z-index: 5;
    font-weight: 900;
  }
  .hud-box {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 6px 14px;
    min-width: 80px;
    text-align: center;
  }
  .hud-box .label { font-size: clamp(0.55em, 1.9vw, 0.7em); color: #aaa; letter-spacing: 1px; }
  .hud-box .val { font-size: clamp(1em, 4vw, 1.4em); color: #feca57; line-height: 1; }
  .hud-box.alt .val { color: #ff6b6b; }
  .hud-box.coins .val { color: #feca57; }

  #overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,5,16,0.95), rgba(30,10,40,0.95));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; gap: 14px; padding: 24px;
    backdrop-filter: blur(8px);
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    margin: 0; font-size: clamp(1.8em, 7vw, 2.8em); letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(135deg, #ff6b6b, #feca57, #ff9ff3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(255,150,80,0.4));
    text-align: center;
  }
  #overlay .sub { color: #ccc; text-align: center; max-width: 90%; line-height: 1.6; font-size: clamp(0.85em, 3vw, 1em); margin: 0; }
  #overlay .stat-grid {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 12px 18px; min-width: 240px;
    font-size: clamp(0.8em, 2.8vw, 0.95em);
  }
  #overlay .row { display: flex; justify-content: space-between; padding: 4px 0; color: #ccc; gap: 24px; }
  #overlay .row b { color: #feca57; font-weight: 900; }
  #overlay .row.new b { color: #ff6b6b; }
  #overlay button {
    padding: 14px 44px;
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    border: none; border-radius: 40px; color: #1a0a05;
    font-size: clamp(1em, 4vw, 1.2em); font-weight: 900; letter-spacing: 3px;
    cursor: pointer; touch-action: manipulation;
    box-shadow: 0 8px 30px rgba(255,107,107,0.5), inset 0 -3px 8px rgba(0,0,0,0.2);
  }
  #overlay button:active { transform: scale(0.96); }
  .tip {
    color: #777; font-size: clamp(0.7em, 2.4vw, 0.85em);
    text-align: center; line-height: 1.6;
  }
  .controls-demo {
    color: #aaa; font-size: clamp(0.78em, 2.8vw, 0.95em);
    text-align: center; line-height: 1.7; max-width: 90%;
  }
  .controls-demo b { color: #feca57; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-box alt"><div class="label">ALTITUDE</div><div class="val" id="hud-alt">0m</div></div>
    <div class="hud-box coins"><div class="label">COIN</div><div class="val" id="hud-coin">0</div></div>
  </div>
  <div id="overlay">
    <h1>PHOENIX RISE</h1>
    <p class="sub">塔の頂を目指して翔べ。<br>溶岩は、ためらう者を呑む。</p>
    <div class="controls-demo">
      <b>引いて、はなす。</b><br>
      鳥を指で引っぱって、スリングショットで飛ばす。<br>
      反対側の壁に着くと、また飛べる。<br>
      <span style="color:#ff6b6b">トゲ</span>と<span style="color:#ff4040">溶岩</span>を避けろ。
    </div>
    <div class="stat-grid" id="stats-grid">
      <div class="row"><span>記録</span><b id="best-alt">0m</b></div>
      <div class="row"><span>累計コイン</span><b id="best-coin">0</b></div>
      <div class="row"><span>挑戦回数</span><b id="best-runs">0</b></div>
    </div>
    <button id="start-btn">START</button>
    <p class="tip">スマホでもPCでも遊べる。LINEで共有OK。</p>
  </div>
</div>

<script>
'use strict';

// ============================================================
// CANVAS & VIEWPORT
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 400, H = 700, DPR = 1;
const WORLD_W = () => W; // tube width = canvas width
const WALL_T = 18; // wall thickness in px

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  // Keep aspect ratio sensible. Tube is portrait.
  const aspect = 9 / 16;
  let cw = rect.width;
  let ch = rect.height;
  if (cw / ch > aspect) cw = ch * aspect;
  else ch = cw / aspect;
  W = Math.floor(cw);
  H = Math.floor(ch);
  DPR = window.devicePixelRatio || 1;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.floor(cw * DPR);
  canvas.height = Math.floor(ch * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ============================================================
// AUDIO (Web Audio API)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, dur, type='sine', vol=0.08, attack=0.005) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + attack);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function sweep(f1, f2, dur, type='sine', vol=0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const SFX = {
  launch: () => sweep(120, 600, 0.2, 'sawtooth', 0.07),
  stick:  () => { tone(180, 0.06, 'square', 0.07); setTimeout(()=>tone(120, 0.08, 'sine', 0.05), 30); },
  coin:   () => { tone(880, 0.06, 'sine', 0.08); setTimeout(()=>tone(1320, 0.08, 'sine', 0.06), 50); },
  hit:    () => { sweep(400, 80, 0.4, 'sawtooth', 0.12); },
  highAlt:() => { tone(660, 0.1, 'triangle', 0.06); setTimeout(()=>tone(880, 0.15, 'triangle', 0.06), 80); },
  aim:    () => tone(220, 0.05, 'sine', 0.04),
};

// ============================================================
// META (localStorage)
// ============================================================
function loadMeta() {
  try { const raw = localStorage.getItem('phoenix_rise_meta'); if (raw) return JSON.parse(raw); } catch(e) {}
  return { bestAlt: 0, totalCoins: 0, runs: 0 };
}
function saveMeta() {
  try { localStorage.setItem('phoenix_rise_meta', JSON.stringify(meta)); } catch(e) {}
}
let meta = loadMeta();

// ============================================================
// WORLD GEN
// ============================================================
// World Y grows DOWN (screen convention). Player starts at large Y, moves to smaller Y as climbing.
// Camera tracks player so player is around H*0.62 in screen.
// "Altitude" = floor((groundY - player.y) / 10) meters.

const GROUND_Y = 10000;
let chunkGen = {}; // chunkY -> true (generated)
const CHUNK_H = 240;

const obstacles = {
  // per chunkKey, store array of obstacles in that chunk
  left: {},   // spike strips: { y, h, dangerous } — left wall section
  right: {},
};
let coins = [];
let coinGen = {};
let particles = [];
let floaters = [];

function rand(seed) {
  // simple deterministic-ish given seed
  let x = Math.sin(seed * 9301 + 49297) * 233280;
  return x - Math.floor(x);
}

function ensureChunk(chunkY) {
  if (chunkGen[chunkY]) return;
  chunkGen[chunkY] = true;

  // Difficulty: deeper = higher altitude = more spikes
  const altMeters = Math.floor((GROUND_Y - chunkY * CHUNK_H) / 10);
  // density grows from 0 at start to 0.55 at 1500m
  const spikeDensity = Math.min(0.5, Math.max(0, (altMeters - 30) / 3000 + 0.05));

  for (const side of ['left', 'right']) {
    obstacles[side][chunkY] = [];
    // walk in tiles of ~40px
    let y = chunkY * CHUNK_H;
    const end = y + CHUNK_H;
    while (y < end) {
      const tileH = 30 + Math.floor(rand(chunkY * 37 + (side === 'left' ? 11 : 23) + y) * 30);
      const isSpike = rand(chunkY * 113 + (side === 'left' ? 7 : 17) + y * 0.31) < spikeDensity;
      if (isSpike && altMeters > 0) {
        obstacles[side][chunkY].push({ y, h: tileH, dangerous: true });
      }
      y += tileH + 6;
    }
  }
  // Spawn coins floating in the middle
  const coinCount = 2 + Math.floor(rand(chunkY * 91) * 3);
  for (let i = 0; i < coinCount; i++) {
    const cy = chunkY * CHUNK_H + rand(chunkY * 71 + i * 13) * CHUNK_H;
    const cx = WALL_T + 30 + rand(chunkY * 53 + i * 19) * (W - WALL_T * 2 - 60);
    coins.push({ x: cx, y: cy, r: 12, collected: false, phase: rand(i) * Math.PI * 2 });
  }
}

function chunkRange() {
  // Generate chunks visible + buffer
  const topY = camera.y - H;
  const botY = camera.y + H * 2;
  const topChunk = Math.floor(topY / CHUNK_H) - 1;
  const botChunk = Math.floor(botY / CHUNK_H) + 1;
  return { topChunk, botChunk };
}
function generateAround() {
  const { topChunk, botChunk } = chunkRange();
  for (let c = topChunk; c <= botChunk; c++) ensureChunk(c);
}

// ============================================================
// GAME STATE
// ============================================================
const player = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  r: 16,
  state: 'stuck',     // stuck | aiming | flying | dead
  stuckSide: 'left',
  trail: [],
  flapPhase: 0,
};

const camera = { y: 0, targetY: 0 };
const lava = { y: 0 };
let aim = null; // { sx, sy, cx, cy }  (in canvas/screen coords)
let game = {
  running: false,
  score: 0,
  coins: 0,
  maxAlt: 0,
  startTime: 0,
  hits: 0,
  shakeMag: 0,
  flashAlpha: 0,
  showHints: true,
};

// ============================================================
// SETUP / RESET
// ============================================================
function startGame() {
  // reset world
  chunkGen = {};
  obstacles.left = {}; obstacles.right = {};
  coins = [];
  particles = []; floaters = [];

  // place player on left wall at the bottom
  player.x = WALL_T + player.r + 2;
  player.y = GROUND_Y - 80;
  player.vx = 0; player.vy = 0;
  player.state = 'stuck';
  player.stuckSide = 'left';
  player.trail = [];

  camera.y = player.y - H * 0.4;
  camera.targetY = camera.y;
  lava.y = GROUND_Y + 60;

  game.running = true;
  game.score = 0;
  game.coins = 0;
  game.maxAlt = 0;
  game.hits = 0;
  game.startTime = performance.now();
  game.shakeMag = 0;
  game.flashAlpha = 0;
  game.showHints = true;

  generateAround();
  document.getElementById('overlay').classList.add('hidden');
}

// ============================================================
// INPUT
// ============================================================
function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
}

function startAim(sx, sy) {
  if (!game.running) return;
  if (player.state !== 'stuck') return;
  player.state = 'aiming';
  aim = { sx, sy, cx: sx, cy: sy };
  SFX.aim();
}
function updateAim(sx, sy) {
  if (player.state !== 'aiming' || !aim) return;
  aim.cx = sx; aim.cy = sy;
}
function releaseAim() {
  if (player.state !== 'aiming' || !aim) return;
  // Launch direction: opposite of drag (slingshot)
  const dx = aim.sx - aim.cx;
  const dy = aim.sy - aim.cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 14) {
    // cancel — too small a drag
    player.state = 'stuck';
    aim = null;
    return;
  }
  // Power scales with drag distance
  const maxDrag = Math.min(W, H) * 0.35;
  const power = Math.min(1, dist / maxDrag);
  const maxV = 14;
  const v = power * maxV + 6;
  player.vx = (dx / dist) * v;
  player.vy = (dy / dist) * v;
  player.state = 'flying';
  player.trail = [];
  game.showHints = false;
  aim = null;
  SFX.launch();
  // push off the wall a touch so we don't immediately collide
  player.x += player.stuckSide === 'left' ? 3 : -3;
}

// touch events
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  ensureAudio();
  if (!game.running) return;
  const t = e.changedTouches[0];
  const p = getCanvasPos(t.clientX, t.clientY);
  startAim(p.x, p.y);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = getCanvasPos(t.clientX, t.clientY);
  updateAim(p.x, p.y);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  releaseAim();
}, { passive: false });
canvas.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  if (player.state === 'aiming') { player.state = 'stuck'; aim = null; }
}, { passive: false });

// mouse events
let mouseDown = false;
canvas.addEventListener('mousedown', (e) => {
  ensureAudio();
  mouseDown = true;
  const p = getCanvasPos(e.clientX, e.clientY);
  startAim(p.x, p.y);
});
canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown) return;
  const p = getCanvasPos(e.clientX, e.clientY);
  updateAim(p.x, p.y);
});
window.addEventListener('mouseup', (e) => {
  if (!mouseDown) return;
  mouseDown = false;
  releaseAim();
});

document.getElementById('start-btn').addEventListener('click', () => {
  ensureAudio();
  startGame();
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ============================================================
// UPDATE
// ============================================================
const G = 0.42;          // gravity
const AIR_DRAG = 0.992;  // velocity multiplier per frame
const LAVA_BASE_SPEED = 0.35; // lava rise rate base
const LAVA_ACCEL = 0.0008;    // per altitude meter

function update(dt) {
  if (!game.running) return;
  if (player.state === 'flying') {
    player.x += player.vx;
    player.y += player.vy;
    player.vy += G;
    player.vx *= AIR_DRAG;
    player.vy *= AIR_DRAG;

    // trail
    player.trail.push({ x: player.x, y: player.y, life: 1 });
    if (player.trail.length > 25) player.trail.shift();

    // wall collisions
    if (player.x - player.r <= WALL_T) {
      player.x = WALL_T + player.r;
      onWallHit('left');
    } else if (player.x + player.r >= W - WALL_T) {
      player.x = W - WALL_T - player.r;
      onWallHit('right');
    }

    // ceiling guard: can't really hit ceiling because camera follows, but just in case
    // floor not solid — lava handles death below

    // coin collection
    for (const c of coins) {
      if (c.collected) continue;
      const dx = c.x - player.x, dy = c.y - player.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < c.r + player.r + 2) {
        c.collected = true;
        game.coins++;
        // score += depends on altitude
        floaters.push(new Floater(c.x, c.y, '+1', '#feca57', 18));
        sparkleAt(c.x, c.y, '#feca57', 14);
        SFX.coin();
      }
    }
  }

  // Trail decay
  for (const t of player.trail) t.life *= 0.92;

  // Lava
  const altMeters = Math.max(0, Math.floor((GROUND_Y - player.y) / 10));
  const lavaSpeed = LAVA_BASE_SPEED + altMeters * LAVA_ACCEL;
  lava.y -= lavaSpeed; // y decreases = lava rises (visually goes up)
  // lava also chases the player at minimum rate
  const minLavaDist = H * 1.4;
  if (lava.y - player.y > minLavaDist) {
    lava.y = player.y + minLavaDist;
  }
  // death by lava
  if (player.y >= lava.y && game.running) {
    die('lava');
  }

  // max altitude tracking
  if (altMeters > game.maxAlt) {
    if (Math.floor(game.maxAlt / 100) < Math.floor(altMeters / 100)) {
      // crossed a 100m line
      SFX.highAlt();
      floaters.push(new Floater(W/2, player.y - 40, `${Math.floor(altMeters/100)*100}m!`, '#ff9ff3', 28));
    }
    game.maxAlt = altMeters;
  }

  // camera follows
  camera.targetY = player.y - H * 0.62;
  camera.y += (camera.targetY - camera.y) * 0.12;

  // shake decay
  game.shakeMag *= 0.85;
  game.flashAlpha *= 0.9;

  // particles & floaters
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life -= dt * 1.6;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) f.update(dt);
  floaters = floaters.filter(f => f.life > 0);

  // generate world
  generateAround();
  // clean far chunks (above us by lots)
  const removeBefore = Math.floor((player.y + H * 2) / CHUNK_H);
  for (const k in obstacles.left) if (+k > removeBefore + 4) { delete obstacles.left[k]; delete obstacles.right[k]; delete chunkGen[k]; }

  // animate
  player.flapPhase += dt * 14;
}

function onWallHit(side) {
  // determine if this segment is spike or safe
  // find obstacle at player.y on this wall
  const inSpike = isSpikeAt(side, player.y);
  if (inSpike) {
    die('spike');
    return;
  }
  // stick
  player.state = 'stuck';
  player.stuckSide = side;
  player.vx = 0; player.vy = 0;
  game.shakeMag = Math.min(game.shakeMag + 5, 12);
  burstAt(player.x, player.y, side === 'left' ? '#ff9ff3' : '#48dbfb', 16);
  SFX.stick();
}

function isSpikeAt(side, y) {
  const c = Math.floor(y / CHUNK_H);
  const arr = obstacles[side][c];
  if (!arr) return false;
  for (const o of arr) {
    if (y >= o.y - 4 && y <= o.y + o.h + 4) return true;
  }
  return false;
}

function die(cause) {
  if (player.state === 'dead') return;
  player.state = 'dead';
  game.running = false;
  game.shakeMag = 20;
  game.flashAlpha = 1;
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: player.x, y: player.y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12 - 4,
      life: 1.2,
      size: 3 + Math.random() * 5,
      color: cause === 'lava' ? '#ff4040' : '#ff6b6b',
    });
  }
  SFX.hit();
  // update meta
  meta.runs++;
  meta.totalCoins += game.coins;
  const newBest = game.maxAlt > meta.bestAlt;
  if (newBest) meta.bestAlt = game.maxAlt;
  saveMeta();
  setTimeout(() => showGameOver(newBest), 900);
}

class Floater {
  constructor(x, y, text, color, size = 22) {
    this.x = x; this.y = y; this.text = text; this.color = color;
    this.size = size; this.life = 1; this.vy = -1.4;
  }
  update(dt) { this.y += this.vy; this.vy *= 0.95; this.life -= dt * 0.9; }
  draw(ox, oy) {
    if (this.life <= 0) return;
    const a = Math.max(0, Math.min(1, this.life * 1.5));
    ctx.globalAlpha = a;
    ctx.font = `900 ${this.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(this.text, this.x + ox, this.y + oy);
    ctx.fillStyle = this.color;
    ctx.fillText(this.text, this.x + ox, this.y + oy);
    ctx.globalAlpha = 1;
  }
}

function burstAt(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.6 + Math.random() * 0.4, size: 2 + Math.random() * 3,
      color
    });
  }
}
function sparkleAt(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 0.5 + Math.random() * 0.4, size: 2 + Math.random() * 2,
      color
    });
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  // Compute camera offset
  const ox = (Math.random() - 0.5) * game.shakeMag;
  const oy = (Math.random() - 0.5) * game.shakeMag;
  const camY = camera.y;

  // Background gradient based on altitude
  const altMeters = Math.max(0, Math.floor((GROUND_Y - player.y) / 10));
  drawBackground(altMeters);

  // Translate so world y = camY appears at screen y = 0
  ctx.save();
  ctx.translate(ox, oy - camY);

  // Stars (parallax)
  drawStars(camY, altMeters);

  // Walls + obstacles
  drawWalls(camY);

  // Coins
  drawCoins(camY);

  // Trail
  drawTrail();

  // Aim line
  if (player.state === 'aiming' && aim) drawAim();

  // Player
  drawPlayer();

  // Particles
  for (const p of particles) {
    const a = Math.max(0, p.life);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floaters
  for (const f of floaters) f.draw(0, 0);

  // Lava (drawn last so it covers everything below)
  drawLava();

  ctx.restore();

  // Flash
  if (game.flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${game.flashAlpha * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Hints
  if (game.showHints && game.running && player.state === 'stuck') {
    drawHint();
  }
}

function drawBackground(altMeters) {
  // Three color stops cycle: night (0-300m) → dawn (300-700m) → cosmos (700+)
  const t = Math.min(altMeters / 1500, 1);
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);
  let top, mid, bot;
  if (altMeters < 300) {
    const k = altMeters / 300;
    top = [lerp(15, 60, k), lerp(8, 10, k), lerp(40, 80, k)];
    bot = [lerp(40, 100, k), lerp(15, 30, k), lerp(70, 80, k)];
  } else if (altMeters < 800) {
    const k = (altMeters - 300) / 500;
    top = [lerp(60, 20, k), lerp(10, 10, k), lerp(80, 60, k)];
    bot = [lerp(100, 50, k), lerp(30, 10, k), lerp(80, 100, k)];
  } else {
    const k = Math.min((altMeters - 800) / 1000, 1);
    top = [lerp(20, 5, k), lerp(10, 5, k), lerp(60, 30, k)];
    bot = [lerp(50, 10, k), lerp(10, 5, k), lerp(100, 60, k)];
  }
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  grad.addColorStop(1, `rgb(${bot[0]},${bot[1]},${bot[2]})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// Cached parallax stars (regenerate as we ascend in big chunks)
let starsCache = []; let starsCacheTopChunk = null;
function ensureStars(camY) {
  const topChunk = Math.floor(camY / 800);
  if (topChunk !== starsCacheTopChunk) {
    starsCacheTopChunk = topChunk;
    starsCache = [];
    for (let cc = topChunk - 1; cc <= topChunk + 3; cc++) {
      for (let i = 0; i < 40; i++) {
        starsCache.push({
          x: rand(cc * 53 + i) * W,
          y: cc * 800 + rand(cc * 97 + i * 11) * 800,
          r: 0.5 + rand(cc * 31 + i * 7) * 1.8,
          p: rand(i + cc) * Math.PI * 2,
        });
      }
    }
  }
}
function drawStars(camY, altMeters) {
  ensureStars(camY);
  const t = performance.now() / 1000;
  for (const s of starsCache) {
    const alpha = 0.4 + 0.5 * Math.abs(Math.sin(s.p + t));
    ctx.globalAlpha = alpha * (altMeters > 500 ? 0.9 : 0.5);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWalls(camY) {
  // Walls themselves
  const wallGradL = ctx.createLinearGradient(0, 0, WALL_T, 0);
  wallGradL.addColorStop(0, '#1a0822');
  wallGradL.addColorStop(1, '#3a1456');
  ctx.fillStyle = wallGradL;
  ctx.fillRect(0, camY - 50, WALL_T, H + 100);

  const wallGradR = ctx.createLinearGradient(W - WALL_T, 0, W, 0);
  wallGradR.addColorStop(0, '#3a1456');
  wallGradR.addColorStop(1, '#1a0822');
  ctx.fillStyle = wallGradR;
  ctx.fillRect(W - WALL_T, camY - 50, WALL_T, H + 100);

  // Neon glow edges
  ctx.strokeStyle = 'rgba(160,80,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(WALL_T + 0.5, camY - 50); ctx.lineTo(WALL_T + 0.5, camY + H + 50); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - WALL_T - 0.5, camY - 50); ctx.lineTo(W - WALL_T - 0.5, camY + H + 50); ctx.stroke();

  // Spike obstacles
  const { topChunk, botChunk } = chunkRange();
  for (let c = topChunk; c <= botChunk; c++) {
    drawSpikes('left', c);
    drawSpikes('right', c);
  }
}
function drawSpikes(side, chunkKey) {
  const arr = obstacles[side][chunkKey];
  if (!arr) return;
  const isLeft = side === 'left';
  for (const o of arr) {
    // base strip
    ctx.fillStyle = '#260010';
    if (isLeft) ctx.fillRect(WALL_T, o.y, 8, o.h);
    else ctx.fillRect(W - WALL_T - 8, o.y, 8, o.h);
    // triangular spikes
    ctx.fillStyle = '#ff3366';
    const spikeH = 14;
    const count = Math.floor(o.h / spikeH);
    for (let i = 0; i < count; i++) {
      const y = o.y + i * spikeH;
      ctx.beginPath();
      if (isLeft) {
        ctx.moveTo(WALL_T + 8, y);
        ctx.lineTo(WALL_T + 22, y + spikeH / 2);
        ctx.lineTo(WALL_T + 8, y + spikeH);
      } else {
        ctx.moveTo(W - WALL_T - 8, y);
        ctx.lineTo(W - WALL_T - 22, y + spikeH / 2);
        ctx.lineTo(W - WALL_T - 8, y + spikeH);
      }
      ctx.closePath();
      ctx.fill();
    }
    // glow
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(255,80,120,0.5)';
    ctx.lineWidth = 1;
    if (isLeft) ctx.strokeRect(WALL_T + 0.5, o.y + 0.5, 8, o.h);
    else ctx.strokeRect(W - WALL_T - 8.5, o.y + 0.5, 8, o.h);
    ctx.shadowBlur = 0;
  }
}

function drawCoins(camY) {
  const t = performance.now() / 1000;
  for (const c of coins) {
    if (c.collected) continue;
    // cull
    if (c.y < camY - 80 || c.y > camY + H + 80) continue;
    const pulse = 1 + 0.2 * Math.sin(t * 3 + c.phase);
    const r = c.r * pulse;
    // glow
    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 2.5);
    grad.addColorStop(0, 'rgba(255,210,80,0.6)');
    grad.addColorStop(1, 'rgba(255,210,80,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(c.x, c.y, r * 2.5, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = '#feca57';
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(c.x - r/3, c.y - r/3, r/4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrail() {
  if (player.trail.length < 2) return;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,150,80,0.7)';
  for (let i = 1; i < player.trail.length; i++) {
    const a = player.trail[i].life;
    ctx.globalAlpha = a * 0.7;
    ctx.lineWidth = player.r * 1.4 * a;
    ctx.beginPath();
    ctx.moveTo(player.trail[i-1].x, player.trail[i-1].y);
    ctx.lineTo(player.trail[i].x, player.trail[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawAim() {
  if (!aim) return;
  // dx, dy in screen coords. Convert to launch direction.
  const dx = aim.sx - aim.cx;
  const dy = aim.sy - aim.cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 4) return;
  const maxDrag = Math.min(W, H) * 0.35;
  const power = Math.min(1, dist / maxDrag);
  const maxV = 14;
  const v = power * maxV + 6;
  const vx = (dx / dist) * v;
  const vy = (dy / dist) * v;

  // Simulate trajectory
  let sx = player.x;
  let sy = player.y;
  let svx = vx, svy = vy;
  ctx.strokeStyle = `rgba(255, 200, 80, ${0.35 + 0.5 * power})`;
  ctx.lineWidth = 3;
  ctx.setLineDash([5, 8]);
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  for (let i = 0; i < 28; i++) {
    sx += svx; sy += svy;
    svy += G; svx *= AIR_DRAG; svy *= AIR_DRAG;
    ctx.lineTo(sx, sy);
    if (sx - player.r <= WALL_T || sx + player.r >= W - WALL_T) break;
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Slingshot rubber band
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  // visualize where finger is in world coords (convert back from screen)
  const worldFingerX = aim.cx; // already in screen X = world X
  const worldFingerY = aim.cy + camera.y;
  ctx.lineTo(worldFingerX, worldFingerY);
  ctx.stroke();
  // power circle at finger
  ctx.fillStyle = `rgba(255,107,107,${0.4 + 0.4 * power})`;
  ctx.beginPath();
  ctx.arc(worldFingerX, worldFingerY, 8 + power * 14, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer() {
  const t = performance.now() / 1000;
  // body glow
  const baseColor = '#ff9b3d';
  const grad = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 3);
  grad.addColorStop(0, 'rgba(255,200,80,0.7)');
  grad.addColorStop(0.5, 'rgba(255,100,40,0.3)');
  grad.addColorStop(1, 'rgba(255,100,40,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 3, 0, Math.PI * 2); ctx.fill();

  // body
  ctx.fillStyle = baseColor;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
  // belly
  ctx.fillStyle = '#ffdca5';
  ctx.beginPath(); ctx.arc(player.x, player.y + player.r * 0.2, player.r * 0.65, 0, Math.PI * 2); ctx.fill();

  // wings (flap if flying)
  const wingFlap = player.state === 'flying' ? Math.sin(player.flapPhase) * 0.5 + 1 : 0.6;
  ctx.fillStyle = '#ff6b3d';
  ctx.beginPath();
  ctx.ellipse(player.x - player.r * 0.9, player.y, player.r * 0.5, player.r * 0.8 * wingFlap, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(player.x + player.r * 0.9, player.y, player.r * 0.5, player.r * 0.8 * wingFlap, 0.3, 0, Math.PI*2);
  ctx.fill();

  // eye
  ctx.fillStyle = '#fff';
  const eyeOffsetX = player.state === 'flying' ? Math.sign(player.vx) * 2 : (player.stuckSide === 'left' ? 3 : -3);
  ctx.beginPath(); ctx.arc(player.x + eyeOffsetX, player.y - 2, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(player.x + eyeOffsetX, player.y - 2, 2, 0, Math.PI * 2); ctx.fill();

  // tail flames when flying
  if (player.state === 'flying') {
    const angle = Math.atan2(player.vy, player.vx) + Math.PI;
    for (let i = 0; i < 3; i++) {
      const flameR = player.r * (0.5 + 0.2 * Math.sin(t * 12 + i));
      const fx = player.x + Math.cos(angle) * (player.r + i * 6);
      const fy = player.y + Math.sin(angle) * (player.r + i * 6);
      ctx.fillStyle = i === 0 ? 'rgba(255,200,80,0.8)' : `rgba(255,${100 - i * 20},40,${0.5 - i * 0.15})`;
      ctx.beginPath(); ctx.arc(fx, fy, flameR, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawLava() {
  // Lava is below camera bottom most of the time. Only draw if visible.
  const lavaTopWorld = lava.y;
  const screenLavaTop = lavaTopWorld;
  // visible if lavaTopWorld < camY + H + 200
  if (screenLavaTop > camera.y + H + 200) return;
  // body
  const grad = ctx.createLinearGradient(0, lavaTopWorld - 80, 0, lavaTopWorld);
  grad.addColorStop(0, 'rgba(255,80,40,0)');
  grad.addColorStop(0.5, 'rgba(255,80,40,0.3)');
  grad.addColorStop(1, '#ff4020');
  ctx.fillStyle = grad;
  ctx.fillRect(0, lavaTopWorld - 80, W, 80);
  ctx.fillStyle = '#ff3010';
  ctx.fillRect(0, lavaTopWorld, W, H * 2);

  // wavy edge
  const t = performance.now() / 200;
  ctx.fillStyle = '#ff5030';
  ctx.beginPath();
  ctx.moveTo(0, lavaTopWorld);
  for (let x = 0; x <= W; x += 10) {
    const yy = lavaTopWorld + Math.sin(x * 0.05 + t) * 5;
    ctx.lineTo(x, yy);
  }
  ctx.lineTo(W, lavaTopWorld + 30);
  ctx.lineTo(0, lavaTopWorld + 30);
  ctx.closePath();
  ctx.fill();

  // sparks
  if (Math.random() < 0.5) {
    particles.push({
      x: Math.random() * W,
      y: lavaTopWorld - Math.random() * 4,
      vx: (Math.random() - 0.5) * 2,
      vy: -2 - Math.random() * 3,
      life: 0.5 + Math.random() * 0.3,
      size: 1 + Math.random() * 2,
      color: '#ffaa40',
    });
  }
}

function drawHint() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = `900 ${Math.floor(H * 0.025)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('引いて、はなす', W / 2, H * 0.45);
  ctx.font = `${Math.floor(H * 0.018)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('Pull and release', W / 2, H * 0.45 + 22);

  // arrow hint near player
  const playerScreenY = player.y - camera.y;
  const arrowStartX = player.x;
  const arrowStartY = playerScreenY;
  const dragX = 90;
  const dragY = 90;
  ctx.globalAlpha = 0.5 + 0.3 * Math.sin(performance.now() / 300);
  ctx.strokeStyle = '#feca57';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(arrowStartX, arrowStartY);
  ctx.lineTo(arrowStartX + dragX, arrowStartY + dragY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#feca57';
  ctx.beginPath();
  ctx.arc(arrowStartX + dragX, arrowStartY + dragY, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ============================================================
// GAME OVER UI
// ============================================================
function showGameOver(newBest) {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <h1>${newBest ? '新記録！' : 'GAME OVER'}</h1>
    <div class="stat-grid">
      <div class="row ${newBest ? 'new' : ''}"><span>到達高度</span><b>${game.maxAlt}m${newBest ? ' 🔥' : ''}</b></div>
      <div class="row"><span>コイン</span><b>${game.coins}</b></div>
      <div class="row" style="border-top:1px solid rgba(255,255,255,0.1);margin-top:6px;padding-top:8px;">
        <span>ベスト</span><b>${meta.bestAlt}m</b></div>
      <div class="row"><span>累計コイン</span><b>${meta.totalCoins}</b></div>
      <div class="row"><span>挑戦回数</span><b>${meta.runs}</b></div>
    </div>
    <button id="restart-btn">もう一度</button>
    <p class="tip">記録に挑め。落ちる前に翔べ。</p>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('restart-btn').addEventListener('click', () => {
    ensureAudio();
    startGame();
  });
}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  if (!game.running) return;
  const altMeters = Math.max(0, Math.floor((GROUND_Y - player.y) / 10));
  document.getElementById('hud-alt').textContent = altMeters + 'm';
  document.getElementById('hud-coin').textContent = game.coins;
}

function refreshStartScreen() {
  document.getElementById('best-alt').textContent = meta.bestAlt + 'm';
  document.getElementById('best-coin').textContent = meta.totalCoins;
  document.getElementById('best-runs').textContent = meta.runs;
}

// ============================================================
// LOOP
// ============================================================
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  render();
  updateHUD();
  requestAnimationFrame(loop);
}

// ============================================================
// BOOT
// ============================================================
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
refreshStartScreen();
requestAnimationFrame(loop);
</script>
